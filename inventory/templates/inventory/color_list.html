{% extends "inventory/base.html" %}

{% block title %}Colores Zaiko{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="mb-0">Colores</h1>
            <a href="{% url 'color_create' %}" class="btn btn-success">Nuevo color</a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Listado de colores</h5>
            </div>
            <div class="card-body p-0">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for color in colors %}
                        <tr>
                            <td>{{ color.nombre }}</td>
                            <td>
                                <a href="{% url 'color_update' color.pk %}" class="btn btn-sm btn-warning">Editar</a>
                                <a href="{% url 'color_delete' color.pk %}" class="btn btn-sm btn-danger">Borrar</a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
