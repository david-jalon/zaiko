<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}Zaiko{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="{% url 'home' %}">Zaiko</a>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'home' %}">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'spool_list' %}">Bobinas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'material_list' %}">Materiales</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'color_list' %}">Colores</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'stock_list' %}">Stock</a>
                        </li>
                    </ul>
                    <form method="post" action="{% url 'logout' %}" class="d-flex">
                        {% csrf_token %}
                        <button class="btn btn-outline-light" type="submit">Cerrar sesión</button>
                    </form>
                </div>
            </div>
        </nav>
        <main class="container mt-4">
            {% block content %}
            {% endblock %}
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
