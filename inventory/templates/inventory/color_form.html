{% extends "inventory/base.html" %}

{% block title %}Nuevo color — Zaiko{% endblock %}

{% block content %}
<h1 class="mb-4">{% if object %}Editar color{% else %}Nuevo color{% endif %}</h1>

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <form method="post">
            {% csrf_token %}
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">Datos del color</h5>
                </div>
                <div class="card-body">
                    <label class="form-label">{{ form.nombre.label }}</label>
                    {{ form.nombre }}
                    {% if form.errors %}
                        <div class="alert alert-danger mt-3">{{ form.errors }}</div>
                    {% endif %}
                </div>
            </div>
            <button type="submit" class="btn btn-success">Guardar color</button>
        </form>
    </div>
</div>
{% endblock %}
